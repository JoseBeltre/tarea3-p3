<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <header class="mb-4">
                <h1 class="h3 mb-1">TODO App</h1>
                <p class="text-body-secondary mb-0">
                  Organize your pending tasks.
                </p>
              </header>

              <form id="todo-form" class="row g-2 mb-4">
                <div class="col-12 col-sm-8">
                  <label for="task-input" class="form-label">Task</label>
                  <input
                    id="task-input"
                    type="text"
                    class="form-control"
                    placeholder="Write a new task"
                  />
                </div>
                <div class="col-12 col-sm-4 d-grid align-self-end">
                  <button type="submit" class="btn btn-primary">Add task</button>
                </div>
              </form>

              <div class="mb-4">
                <label for="search-input" class="form-label">Search tasks</label>
                <input
                  id="search-input"
                  type="search"
                  class="form-control"
                  placeholder="Type to filter tasks"
                />
              </div>

              <section aria-labelledby="todo-list-title">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h2 id="todo-list-title" class="h5 mb-0">Task list</h2>
                  <span id="task-counter" class="badge text-bg-secondary">0 tasks</span>
                </div>
                <ul id="todo-list" class="list-group mb-3"></ul>
                <div id="empty-state" class="alert alert-info mb-0" role="status">
                  No tasks yet. Add your first one.
                </div>
              </section>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="./src/js/app.js"></script>
  </body>
</html>
